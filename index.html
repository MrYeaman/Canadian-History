<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 10 History: Writing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .paper-texture {
            background-color: #fffdfa;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 2.5rem;
            line-height: 2.5rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .paper-texture:focus { outline: none; border-color: #94a3b8; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Login Overlay -->
    <div id="auth-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Student Portal</h2>
                <p class="text-gray-500 text-sm">Select your assignment and enter your name</p>
            </div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Assignment</label>
                    <select id="assignment-select" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-base bg-gray-50">
                        <option value="Home Front Letter">Letter from the Home Front</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Your Name</label>
                    <input type="text" id="first-name" placeholder="e.g. Alex" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-lg">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors pt-4">Enter Writing Space</button>
            </form>
        </div>
    </div>

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <div class="bg-blue-100 p-2 rounded-lg text-blue-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
            </div>
            <div>
                <h1 id="header-assignment" class="font-bold text-gray-800 leading-tight">Assignment</h1>
                <p id="user-display" class="text-xs text-blue-600 font-semibold italic">Not signed in</p>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div id="word-count" class="text-sm font-bold text-gray-700 hidden sm:block">0 words</div>
            <div id="connection-status" class="w-3 h-3 rounded-full bg-gray-300"></div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-6 md:p-10">
        <div class="mb-8 bg-blue-50 border-l-4 border-blue-400 p-5 rounded-r-lg shadow-sm">
            <h2 id="prompt-title" class="text-blue-900 font-bold mb-1 italic text-lg">---</h2>
            <p id="prompt-desc" class="text-blue-800 text-sm italic">Please follow the instructions provided in class. Ensure you mention rationing, the war effort, and the local atmosphere.</p>
        </div>
        <div class="relative">
            <textarea id="writing-area" class="paper-texture w-full min-h-[650px] p-10 rounded-lg resize-none overflow-y-auto" placeholder="Dearest..." disabled></textarea>
            <div id="save-status" class="absolute bottom-4 right-6 text-xs text-gray-400 italic">Connecting...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'history-portal-g10';

        let firstName = localStorage.getItem('hp_name');
        let selectedAssignment = localStorage.getItem('hp_assignment');

        const authOverlay = document.getElementById('auth-overlay');
        const writingArea = document.getElementById('writing-area');
        const saveStatus = document.getElementById('save-status');
        const statusIndicator = document.getElementById('connection-status');

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            firstName = document.getElementById('first-name').value.trim();
            selectedAssignment = document.getElementById('assignment-select').value;
            
            localStorage.setItem('hp_name', firstName);
            localStorage.setItem('hp_assignment', selectedAssignment);
            
            initAuth();
        });

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user && firstName && selectedAssignment) {
                authOverlay.classList.add('hidden');
                document.getElementById('user-display').textContent = firstName;
                document.getElementById('header-assignment').textContent = selectedAssignment;
                document.getElementById('prompt-title').textContent = selectedAssignment;
                
                statusIndicator.classList.remove('bg-gray-300');
                statusIndicator.classList.add('bg-green-500');
                
                writingArea.disabled = false;
                loadData();
            }
        });

        function getStorageId() {
            const cleanName = firstName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const cleanAssign = selectedAssignment.toLowerCase().replace(/[^a-z0-9]/g, '_');
            return `${cleanAssign}__${cleanName}`;
        }

        async function loadData() {
            const docId = getStorageId();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', docId);
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) writingArea.value = snap.data().content || "";
                saveStatus.textContent = "Last sync: Just now";
                updateWordCount();
            } catch (e) {
                saveStatus.textContent = "Error loading data";
            }
        }

        let timer;
        writingArea.addEventListener('input', () => {
            saveStatus.textContent = "Typing...";
            clearTimeout(timer);
            timer = setTimeout(saveData, 1000);
            updateWordCount();
        });

        function updateWordCount() {
            const words = writingArea.value.trim() ? writingArea.value.trim().split(/\s+/).length : 0;
            document.getElementById('word-count').textContent = `${words} words`;
        }

        async function saveData() {
            if (!auth.currentUser || !firstName) return;
            const docId = getStorageId();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', docId);
            
            try {
                await setDoc(docRef, {
                    studentName: firstName,
                    assignment: selectedAssignment,
                    content: writingArea.value,
                    lastUpdated: new Date().toISOString(),
                    wordCount: writingArea.value.trim().split(/\s+/).length
                }, { merge: true });
                saveStatus.textContent = "Cloud saved: " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            } catch (e) {
                saveStatus.textContent = "Offline / Save Error";
            }
        }

        // Initialize if already logged in
        if (firstName && selectedAssignment) {
            initAuth();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
        body { background-color: #020617; font-family: 'Inter', sans-serif; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .paper-texture {
            background-color: #fffdfa;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 2.5rem;
            line-height: 2.5rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-2xl w-full max-w-sm border border-slate-800">
            <h2 class="text-xl font-bold text-white mb-6 text-center">Teacher Access</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full bg-slate-800 p-3 rounded border border-slate-700" required>
                <input type="password" id="password" placeholder="Password" class="w-full bg-slate-800 p-3 rounded border border-slate-700" required>
                <button type="submit" class="w-full bg-blue-600 p-3 rounded font-bold">Login</button>
                <p id="error-msg" class="text-red-500 text-xs hidden">Authentication Failed</p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-content" class="invisible">
        <header class="max-w-7xl mx-auto mb-8 flex justify-between items-center border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-bold">Exam Control Tower</h1>
            <div class="flex gap-4">
                <button id="view-monitor-btn" class="px-4 py-2 bg-blue-600 rounded">Monitor</button>
                <button id="view-gradebook-btn" class="px-4 py-2 bg-slate-800 rounded">Gradebook</button>
                <button id="logout-btn" class="px-4 py-2 bg-red-900/50 rounded">Sign Out</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto">
            <div id="student-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </main>
    </div>

    <!-- Modal -->
    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between">
                <h2 id="modal-name" class="text-white font-bold"></h2>
                <button id="close-modal" class="text-white">Close</button>
            </div>
            <div class="p-8 flex-1 overflow-y-auto">
                <div id="modal-content" class="paper-texture"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPlKHGjh5y8UVq7ygLhkutZFjDnJYI7ls",
            authDomain: "canadian-history-portal.firebaseapp.com",
            projectId: "canadian-history-portal",
            storageBucket: "canadian-history-portal.firebasestorage.app",
            messagingSenderId: "21075780226",
            appId: "1:21075780226:web:7b6d9b938e7bedb9e80a9b"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const targetAppId = 'history-portal-g10';

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('invisible');
                startMonitor();
            } catch (err) {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').onclick = () => { signOut(auth).then(() => location.reload()); };
        document.getElementById('close-modal').onclick = () => document.getElementById('view-modal').classList.add('hidden');

        function startMonitor() {
            const ref = collection(db, 'artifacts', targetAppId, 'public', 'data', 'submissions');
            onSnapshot(ref, (snap) => {
                const grid = document.getElementById('student-grid');
                grid.innerHTML = '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 p-4 rounded cursor-pointer";
                    card.innerHTML = `<h3 class="text-white font-bold">${data.studentName}</h3><p class="text-blue-400 text-xs">${data.assignment}</p>`;
                    card.onclick = () => {
                        document.getElementById('modal-name').textContent = data.studentName;
                        document.getElementById('modal-content').textContent = data.content;
                        document.getElementById('view-modal').classList.remove('hidden');
                    };
                    grid.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Control Tower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; font-family: sans-serif; color: white; }
        .paper-texture { background-color: #fffdfa; color: black; font-family: serif; font-size: 1.25rem; padding: 40px; }
        #annotation-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        .pen-active #annotation-canvas { pointer-events: auto; cursor: crosshair; }
    </style>
</head>
<body class="p-8">

    <header class="max-w-7xl mx-auto mb-8 flex justify-between items-center border-b border-slate-800 pb-6">
        <h1 class="text-3xl font-bold">Exam Control Tower</h1>
        <div class="flex items-center gap-4">
            <span id="active-count" class="text-2xl font-bold text-blue-400">0</span>
            <span class="text-slate-500 uppercase text-xs font-bold tracking-widest">Active</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6" id="student-grid"></main>

    <!-- Reading Modal -->
    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 w-full max-w-4xl h-[90vh] rounded-xl flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 id="modal-name" class="font-bold text-lg"></h2>
                <div class="flex gap-2">
                    <button id="toggle-pen" class="bg-slate-700 px-3 py-1 rounded text-xs font-bold">Blue Pen</button>
                    <button id="clear-pen" class="text-red-400 px-3 py-1 rounded text-xs font-bold">Clear</button>
                    <input type="number" id="grade-input" class="w-16 bg-slate-950 px-2 rounded text-sm text-center">
                    <button id="save-btn" class="bg-blue-600 px-3 py-1 rounded text-xs font-bold">Save</button>
                    <button id="close-modal" class="text-slate-500 px-2 font-bold">Close</button>
                </div>
            </div>
            <div id="modal-container" class="flex-1 overflow-auto bg-slate-200 relative">
                <div id="modal-content" class="paper-texture"></div>
                <canvas id="annotation-canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPlKHGjh5y8UVq7ygLhkutZFjDnJYI7ls",
            authDomain: "canadian-history-portal.firebaseapp.com",
            projectId: "canadian-history-portal",
            storageBucket: "canadian-history-portal.firebasestorage.app",
            messagingSenderId: "21075780226",
            appId: "1:21075780226:web:7b6d9b938e7bedb9e80a9b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = 'history-portal-g10';

        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        let isPen = false;
        let currentId = null;

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'), (snap) => {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            let active = 0;
            snap.docs.forEach(d => {
                const sub = {id: d.id, ...d.data()};
                if (!sub.submitted) active++;
                const div = document.createElement('div');
                div.className = "bg-slate-900 border border-slate-700 p-4 rounded-xl cursor-pointer hover:border-blue-500";
                div.innerHTML = `<h3 class="font-bold">${sub.studentName}</h3><p class="text-xs text-slate-400">${sub.assignment}</p>`;
                div.onclick = () => openModal(sub);
                grid.appendChild(div);
            });
            document.getElementById('active-count').innerText = active;
        });

        function openModal(sub) {
            currentId = sub.id;
            document.getElementById('modal-name').innerText = sub.studentName;
            document.getElementById('grade-input').value = sub.grade || '';
            document.getElementById('modal-content').innerText = sub.content;
            
            canvas.width = 800;
            canvas.height = document.getElementById('modal-content').scrollHeight;
            
            if(sub.annotations) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = sub.annotations;
            } else {
                ctx.clearRect(0,0,canvas.width, canvas.height);
            }
            document.getElementById('view-modal').classList.remove('hidden');
        }

        document.getElementById('toggle-pen').onclick = (e) => {
            isPen = !isPen;
            document.getElementById('modal-container').classList.toggle('pen-active', isPen);
            e.target.className = isPen ? "bg-blue-600 px-3 py-1 rounded text-xs font-bold" : "bg-slate-700 px-3 py-1 rounded text-xs font-bold";
        };

        canvas.onpointerdown = (e) => { if(isPen) { ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); } };
        canvas.onpointermove = (e) => { if(isPen && e.buttons === 1) { ctx.lineWidth = 2; ctx.strokeStyle = 'blue'; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };

        document.getElementById('save-btn').onclick = async () => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentId), {
                grade: document.getElementById('grade-input').value,
                annotations: canvas.toDataURL()
            });
            alert("Saved");
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('view-modal').classList.add('hidden');
        document.getElementById('clear-pen').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    </script>
</body>
</html>

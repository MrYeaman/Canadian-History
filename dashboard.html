<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 10 History - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
        
        body { background-color: #020617; font-family: 'Inter', sans-serif; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        #modal-scroll-area::-webkit-scrollbar { width: 8px; }
        #modal-scroll-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .paper-texture {
            background-color: #fffdfa;
            background-image: linear-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 100% 2.5rem;
            line-height: 2.5rem;
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            position: relative;
            width: 100%;
            max-width: 800px; 
            min-height: 1056px; 
            margin: 0 auto;
            box-sizing: border-box;
        }

        #annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 20;
        }

        .pen-active #annotation-canvas {
            pointer-events: auto;
            cursor: crosshair;
        }

        .blur-bg { backdrop-filter: blur(12px); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <!-- PASSWORD PROTECTION OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 blur-bg">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="bg-blue-900/30 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Teacher Access Required</h2>
            <p class="text-slate-500 text-sm mb-6">Enter your security key to view the Control Tower.</p>
            
            <form id="login-form" class="space-y-4">
                <input type="password" id="access-key" autocomplete="current-password" placeholder="Enter Security Key" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center tracking-widest" required autofocus>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg">
                    Unlock Dashboard
                </button>
                <p id="login-error" class="text-red-500 text-xs font-semibold hidden">Invalid Security Key</p>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-content" class="hidden">
        <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-end border-b border-slate-800 pb-6 gap-6">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Exam Control Tower</h1>
                <p class="text-slate-500 font-medium tracking-wide mt-1">Grade 10 History Portal: Live Monitoring</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 px-6 py-2 rounded-lg border border-slate-800 text-center flex items-center gap-4">
                    <span class="text-xs text-slate-500 uppercase font-black tracking-widest">Active Writers</span>
                    <span id="active-count" class="text-2xl font-mono font-bold text-emerald-400">0</span>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto pb-12">
            <div id="loading-indicator" class="text-center py-12 text-slate-500 font-bold animate-pulse">Establishing Secure Uplink...</div>
            <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 hidden"></div>
            <div id="empty-state" class="hidden text-center py-20 border-2 border-dashed border-slate-800 rounded-2xl text-slate-500">No assessments found.</div>
        </main>
    </div>

    <!-- Reading Modal -->
    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-slate-900 rounded-xl w-full max-w-5xl max-h-[95vh] flex flex-col shadow-2xl border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                <div class="flex-1">
                    <h2 id="modal-student-name" class="text-xl font-bold text-white">Student Name</h2>
                    <p id="modal-assignment" class="text-blue-400 font-medium text-xs">Assignment</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                        <button id="toggle-pen-btn" class="px-4 py-2 rounded-md text-[11px] font-bold uppercase transition flex items-center gap-2 bg-slate-700 text-slate-400 hover:text-white">
                            <span class="w-2 h-2 rounded-full bg-current"></span> Blue Pen
                        </button>
                        <button id="clear-pen-btn" class="px-3 py-2 rounded-md text-[11px] font-bold uppercase text-red-400 hover:bg-red-900/30 transition">Clear</button>
                    </div>

                    <button id="save-notes-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-[11px] font-bold uppercase transition">Save Notes</button>
                    
                    <button id="close-modal" class="text-slate-500 hover:text-white p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
            </div>
            
            <div id="modal-scroll-area" class="flex-1 overflow-y-auto bg-slate-800/50 p-4 md:p-8 flex justify-center">
                <div id="canvas-container" class="relative shadow-2xl rounded-sm w-full max-w-[800px] bg-white">
                    <div id="modal-content" class="paper-texture text-slate-800 p-10 md:p-16 whitespace-pre-wrap"></div>
                    <canvas id="annotation-canvas"></canvas>
                </div>
            </div>
            
            <div class="px-6 py-2 bg-slate-900 border-t border-slate-800 text-[10px] text-slate-500 flex justify-between uppercase font-bold tracking-widest">
                <span id="modal-word-count">0 words</span>
                <span id="save-indicator" class="text-emerald-500 opacity-0 transition-opacity">Saved successfully!</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Canadian History Project Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBPlKHGjh5y8UVq7ygLhkutZFjDnJYI7ls",
            authDomain: "canadian-history-portal.firebaseapp.com",
            projectId: "canadian-history-portal",
            storageBucket: "canadian-history-portal.firebasestorage.app",
            messagingSenderId: "21075780226",
            appId: "1:21075780226:web:7b6d9b938e7bedb9e80a9b"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const targetAppId = 'history-portal-g10';

        // Hash provided by you: 4c23fb39df853626ea346e6e7e5512ad
        const TEACHER_PASSWORD_HASH = "4c23fb39df853626ea346e6e7e5512ad";

        let allSubmissions = [];
        let currentlyViewingId = null;

        // DOM Elements
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const accessInput = document.getElementById('access-key');
        const dashContent = document.getElementById('dashboard-content');
        
        const grid = document.getElementById('student-grid');
        const activeCountEl = document.getElementById('active-count');
        const emptyState = document.getElementById('empty-state');
        const loadingIndicator = document.getElementById('loading-indicator');
        
        const modal = document.getElementById('view-modal');
        const modalContent = document.getElementById('modal-content');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const togglePenBtn = document.getElementById('toggle-pen-btn');

        if (sessionStorage.getItem('teacher_authenticated') === 'true') {
            unlockDashboard();
        }

        accessInput.addEventListener('input', () => {
            loginError.classList.add('hidden');
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputHash = CryptoJS.MD5(accessInput.value).toString();
            
            if (inputHash === TEACHER_PASSWORD_HASH) {
                sessionStorage.setItem('teacher_authenticated', 'true');
                unlockDashboard();
            } else {
                loginError.classList.remove('hidden');
                accessInput.value = '';
                accessInput.focus();
            }
        });

        function unlockDashboard() {
            loginOverlay.classList.add('hidden');
            dashContent.classList.remove('hidden');
            initDashboard();
        }

        async function initDashboard() {
            try {
                await signInAnonymously(auth);
                listenToSubmissions();
            } catch (err) {
                console.error("Auth Error:", err);
                loadingIndicator.innerHTML = `<span class="text-red-500">Authentication Failed. Check console.</span>`;
            }
        }

        function listenToSubmissions() {
            const submissionsRef = collection(db, 'artifacts', targetAppId, 'public', 'data', 'submissions');
            onSnapshot(submissionsRef, (snapshot) => {
                allSubmissions = [];
                snapshot.forEach(doc => {
                    allSubmissions.push({ id: doc.id, ...doc.data() });
                });
                loadingIndicator.classList.add('hidden');
                renderGrid();
            }, (error) => {
                console.error("Database Error:", error);
                loadingIndicator.innerHTML = `<span class="text-red-500">Permission Denied. Ensure Firestore rules allow read access.</span>`;
            });
        }

        function formatTimeAgo(isoString) {
            if (!isoString) return '---';
            const date = new Date(isoString);
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        }

        function renderGrid() {
            const now = new Date();
            let activeCount = 0;
            grid.innerHTML = '';

            const sorted = allSubmissions.sort((a, b) => {
                const nameA = (a.studentName || '').toLowerCase();
                const nameB = (b.studentName || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });

            if (sorted.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                activeCountEl.innerText = '0';
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            sorted.forEach(sub => {
                let isSubmitted = sub.submitted === true;
                let lastUpdatedTime = new Date(sub.lastUpdated || 0);
                let minutesSinceUpdate = (now - lastUpdatedTime) / 60000;
                let isActive = !isSubmitted && minutesSinceUpdate < 2;
                if (isActive) activeCount++;

                let statusColor = isSubmitted ? 'bg-slate-700' : (isActive ? 'bg-emerald-500 status-pulse' : 'bg-amber-500');
                let statusText = isSubmitted ? 'LOCKED' : (isActive ? 'TYPING...' : 'IDLE');
                let borderColor = isSubmitted ? 'border-slate-800' : (isActive ? 'border-emerald-500/50' : 'border-amber-500/50');

                const card = document.createElement('div');
                card.className = `bg-slate-900 border ${borderColor} p-5 rounded-xl hover:bg-slate-800 transition cursor-pointer flex flex-col`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full ${statusColor}"></div>
                            <span class="text-[10px] font-black tracking-widest uppercase text-slate-400">${statusText}</span>
                        </div>
                        <span class="text-[10px] font-mono text-slate-500">${formatTimeAgo(sub.lastUpdated)}</span>
                    </div>
                    <h3 class="font-bold text-lg text-white mb-1 truncate">${sub.studentName || 'Unknown'}</h3>
                    <p class="text-xs text-blue-400 font-bold truncate mb-4">${sub.assignment || 'No Assignment'}</p>
                    <div class="flex justify-between items-end border-t border-slate-800 pt-3 mt-auto">
                        <span class="text-xs text-slate-500">${sub.wordCount || 0} words</span>
                        <button class="text-[10px] uppercase font-bold tracking-widest bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded transition">Review</button>
                    </div>
                `;

                card.addEventListener('click', () => openReview(sub));
                grid.appendChild(card);
            });
            activeCountEl.innerText = activeCount;
        }

        // Re-render to update relative times every 30 seconds
        setInterval(renderGrid, 30000);

        let isDrawing = false;
        let penEnabled = false;

        function resizeCanvas() {
            canvas.width = modalContent.offsetWidth;
            canvas.height = modalContent.scrollHeight;
            canvas.style.width = modalContent.offsetWidth + 'px';
            canvas.style.height = modalContent.scrollHeight + 'px';
        }

        async function openReview(sub) {
            currentlyViewingId = sub.id;
            document.getElementById('modal-student-name').innerText = sub.studentName || 'Student';
            document.getElementById('modal-assignment').innerText = sub.assignment || 'Assignment';
            document.getElementById('modal-word-count').innerText = `${sub.wordCount || 0} words`;
            
            modalContent.textContent = sub.content || "(Empty document)";
            modal.classList.remove('hidden');
            
            // Wait slightly for DOM to render the text height before sizing canvas
            setTimeout(() => {
                resizeCanvas();
                if (sub.annotations) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = sub.annotations;
                }
            }, 50);
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            modal.classList.add('hidden');
            currentlyViewingId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            penEnabled = false;
            canvasContainer.classList.remove('pen-active');
            togglePenBtn.classList.replace('bg-blue-600', 'bg-slate-700');
            togglePenBtn.classList.replace('text-white', 'text-slate-400');
        });

        togglePenBtn.addEventListener('click', () => {
            penEnabled = !penEnabled;
            if (penEnabled) {
                canvasContainer.classList.add('pen-active');
                togglePenBtn.classList.replace('bg-slate-700', 'bg-blue-600');
                togglePenBtn.classList.replace('text-slate-400', 'text-white');
            } else {
                canvasContainer.classList.remove('pen-active');
                togglePenBtn.classList.replace('bg-blue-600', 'bg-slate-700');
                togglePenBtn.classList.replace('text-white', 'text-slate-400');
            }
        });

        document.getElementById('clear-pen-btn').addEventListener('click', () => {
            if (confirm("Clear all blue pen notes for this student?")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (!penEnabled) return;
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing || !penEnabled) return;
            e.preventDefault(); // Prevent scrolling while drawing
            const pos = getMousePos(e);
            
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#2563eb'; // Blue pen color
            
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Attach Drawing Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('save-notes-btn').addEventListener('click', async () => {
            if (!currentlyViewingId) return;
            
            const btn = document.getElementById('save-notes-btn');
            const indicator = document.getElementById('save-indicator');
            
            btn.textContent = "Saving...";
            btn.disabled = true;
            
            try {
                const dataUrl = canvas.toDataURL('image/png');
                const docRef = doc(db, 'artifacts', targetAppId, 'public', 'data', 'submissions', currentlyViewingId);
                
                await updateDoc(docRef, {
                    annotations: dataUrl
                });
                
                indicator.style.opacity = '1';
                setTimeout(() => {
                    indicator.style.opacity = '0';
                    btn.textContent = "Save Notes";
                    btn.disabled = false;
                }, 2000);
                
            } catch (e) {
                console.error("Error saving annotations:", e);
                btn.textContent = "Error!";
                setTimeout(() => {
                    btn.textContent = "Save Notes";
                    btn.disabled = false;
                }, 2000);
            }
        });

    </script>
</body>
</html>

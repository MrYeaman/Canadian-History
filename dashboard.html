<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 10 History - Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
        body { background-color: #020617; font-family: 'Inter', sans-serif; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .paper-texture { background-color: #fffdfa; background-image: linear-gradient(#e5e5e5 1px, transparent 1px); background-size: 100% 2.5rem; line-height: 2.5rem; font-family: 'Crimson Pro', serif; font-size: 1.25rem; }
        #canvas-container { width: 800px; margin: 0 auto; position: relative; }
        #annotation-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 20; touch-action: none; cursor: crosshair; }
        .pen-active #annotation-canvas { pointer-events: auto; }
        .blur-bg { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">

    <!-- LOGIN -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 blur-bg">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <h2 class="text-xl font-bold text-white mb-6">Teacher Access</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email-input" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg text-center" required>
                <input type="password" id="password-input" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg text-center" required>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-content" class="invisible">
        <header class="max-w-7xl mx-auto mb-8 flex justify-between items-center border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-bold text-white">Exam Control Tower</h1>
            <button id="logout-btn" class="text-slate-500 hover:text-white underline text-xs">Sign Out</button>
        </header>

        <main class="max-w-7xl mx-auto">
            <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="view-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 rounded-xl w-full max-w-6xl max-h-[95vh] flex flex-col overflow-hidden border border-slate-700">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 id="modal-name" class="font-bold text-lg"></h2>
                <div class="flex gap-2">
                    <button id="toggle-pen-btn" class="bg-slate-700 p-2 rounded">Blue Pen</button>
                    <button id="save-btn" class="bg-blue-600 px-4 py-2 rounded">Save</button>
                    <button id="close-modal" class="bg-slate-700 p-2 rounded">Close</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8">
                <div id="canvas-container">
                    <div id="modal-content" class="paper-texture p-16"></div>
                    <canvas id="annotation-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Logic
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                loginOverlay.classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('invisible');
                initDashboard();
            } catch(e) { alert("Invalid Credentials"); }
        };

        function listenToSubmissions() {
            onSnapshot(collection(db, 'artifacts/history-portal-g10/public/data/submissions'), (snap) => {
                allSubmissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderGrid();
            });
        }

        function initDashboard() { listenToSubmissions(); }
        // ... (Render grid and annotation logic here)
    </script>
</body>
</html>
